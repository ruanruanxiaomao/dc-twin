name: pages

# Static demo: no backend, no Blender. The data layer is regenerated in CI
# and dc_twin/export.py writes demo/ (data.js + canvas viewer + GLB).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "dc_twin/static_demo/**"
      - "dc_twin/export.py"
      - "scripts/export_demo.py"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e .
      - name: Regenerate data layer and scenarios
        run: python -m dc_twin run --scope scenarios
      - name: Export static demo
        run: python scripts/export_demo.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo/
      - id: deployment
        uses: actions/deploy-pages@v4
