name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  data:
    name: data (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    timeout-minutes: 15
    env:
      # Windows runner 的默认代码页不是 UTF-8，中文报告会 encode 失败
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Environment consistency (python range + locked deps + doctor)
        run: python scripts/bootstrap.py --check

      - name: Lint new code (legacy scripts predate the lint gate)
        run: ruff check dc_twin run.py console scripts/manifest.py scripts/validate_data.py scripts/build_docs_assets.py scripts/check_claims.py scripts/check_exe.py scripts/clean.py scripts/bootstrap.py scripts/kpi_baseline.py scripts/real_data_pilot.py scripts/check_dock.py tests

      - name: Doctor
        run: python -m dc_twin doctor

      - name: Data + scenario chain (no Blender)
        run: python -m dc_twin run --scope scenarios

      - name: KPI baseline drift (8 scenarios / 192 metrics)
        run: |
          python scripts/kpi_baseline.py --self-test
          python scripts/kpi_baseline.py --check

      - name: Real-data pilot (CSV orders through the real engine)
        run: |
          python scripts/real_data_pilot.py --check

      - name: Negative tests (17 cases)
        run: python tests/run_all_negative.py

      - name: Derived reports and output contracts
        run: |
          python scripts/validate_data.py
          python scripts/report_status.py
          python scripts/manifest.py

      - name: Doc drift guard (status doc vs artifacts vs plan copy)
        run: |
          python scripts/check_doc_drift.py --self-test
          python scripts/check_doc_drift.py

      - name: Process config guard (L14-L22)
        run: |
          python scripts/check_process.py --self-test
          python scripts/check_process.py

      - name: Functional area guard (L23-L26)
        run: |
          python scripts/spec_areas.py --self-test
          python scripts/spec_areas.py

      - name: Area variant guard (cockpit ↔ generator ↔ spec)
        run: |
          python scripts/build_variant.py --build
          python scripts/check_studio.py --self-test
          python scripts/check_studio.py

      - name: Station queue guard (slots 4 -> 1 must queue)
        run: |
          python scripts/check_station.py
          python scripts/check_dock.py

      - name: Deadlock yield guard (yield off must be worse)
        run: python scripts/check_deadlock.py

      - name: Claim consistency guard (docs numbers vs code)
        run: |
          python scripts/check_claims.py --self-test
          python scripts/check_claims.py

      - name: Web snapshot guard (docs/app links + hashes)
        run: |
          python scripts/check_webapp.py --self-test
          python scripts/check_webapp.py

      - name: Refactor chain (13 gates: R0-R8 + R5 policy)
        # 这条链此前**只在本机跑**：CI 从 lint 起步就没绿过，所以 R8 系列的门
        # 在 CI 上从未执行。它同时生成 out/ 下 pytest 需要的下游产物
        # （out/exp/area、asset_*_report 等）——那些是 gitignore 的，干净检出时没有。
        run: python -m dc_twin run --scope refactor

      - name: Re-pin manifest after gate runs
        # 门会重写 out/ 下的报告；manifest 若停在门之前，契约测试必红（顺序假红）。
        run: python scripts/manifest.py

      - name: pytest (no Blender)
        run: pytest -m "not blender" --cov=dc_twin --cov-report=term-missing

      - name: Acceptance tier + JUnit
        run: python -m dc_twin validate --tier data --junit out/junit.xml

      - name: Upload JUnit on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.os }}-${{ matrix.python }}
          path: out/junit.xml
          if-no-files-found: ignore

  blender-smoke:
    # Manual only: downloading a portable Blender is slow and the full
    # 942-frame render is intentionally NOT part of CI.
    name: blender one-frame smoke
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e .
      - name: Download portable Blender 5.2
        run: |
          set -euo pipefail
          curl -fsSL -o blender.tar.xz \
            "https://download.blender.org/release/Blender5.2/blender-5.2.3-linux-x64.tar.xz"
          mkdir -p /tmp/blender && tar -xf blender.tar.xz -C /tmp/blender --strip-components=1
          echo "BLENDER_EXE=/tmp/blender/blender" >> "$GITHUB_ENV"
      - name: Build scene and render one preview frame
        env:
          DC_RENDER_PREVIEW: "1"
        run: |
          python -m dc_twin run --scope data
          "$BLENDER_EXE" -b --factory-startup -P scripts/build_dc.py
          "$BLENDER_EXE" -b --factory-startup -P scripts/inspect_blend.py
          "$BLENDER_EXE" -b --factory-startup -P scripts/render.py
      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: blender-preview
          path: out/renders/*.png
          if-no-files-found: ignore
